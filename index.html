<!DOCTYPE html> <!-- tells browser you are using HTML5 -->
<html lang="en"> <!-- tells browser the language of the document -->

<head>
    <meta charset="UTF-8"> <!-- specifies the character encoding for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ensures proper rendering on mobile devices -->
    <title>My Portfolio</title> <!-- sets the title of the document -->
    <link rel="stylesheet" href="css/main.css"> <!-- links to an external CSS file for styling -->
    <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 600px)">
    <link rel="stylesheet" href="css/tablet.css" media="screen and (min-width: 601px) and (max-width: 1024px)">
    <link rel="stylesheet" href="css/laptop.css" media="screen and (min-width: 1025px)">
</head>

<body>  
    <header> <!-- semantic HTML tag used for the top section of a webpage. -->
        <h1>Welcome to My Portfolio</h1> <!-- main heading of the webpage -->
        <nav> <!-- semantic HTML tag used for navigation links. -->
            <a href="index.html">Home</a> <!-- link to the home page -->
            <a href="about.html">About Me</a> <!-- link to the about page -->
            <a href="projects.html">Projects</a> <!-- link to the projects page -->
            <a href="contact.html">Contact</a> <!-- link to the contact page -->
        </nav>
    </header>
    <main> <!-- semantic HTML tag used for the main content of the webpage. -->
        <section> <!-- semantic HTML tag used for a section of content. -->
            <h2>Welcome to my portfolio</h2> <!-- subheading for the about section -->
            <p>Hello! Welcome to my personal portfolio website. Here you can learn more about me, explore my projects, and contact me</p>
        </section>
    </main>
    <footer> <!-- semantic HTML tag used for the bottom section of a webpage. -->
        <p>Email: nabil.alsaleh@ontariotechu.net</p> <!-- copyright notice -->
        <p>&copy; 2026 Nabil Al-Saleh. All rights reserved.</p>

    </footer>
</body>
</html>
